# Render 무료 플랜은 15분 동안 요청이 없으면 서버를 재운다.
# 잠든 뒤 첫 요청은 30초~1분 걸리거나 끊기므로, 10분마다 /health 를 불러 깨어 있게 한다.
# 저장소 Settings → Secrets and variables → Actions → Variables 에 BACKEND_URL(예: https://rom-back.onrender.com)을 넣어야 동작한다.
# 이 저장소는 공개라 Actions 사용 시간이 무료다 (비공개인 rom-back 에 두면 무료 시간을 넘긴다).
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL 변수가 없어 건너뜀"
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 10 --max-time 90 "${BACKEND_URL%/}/health"
