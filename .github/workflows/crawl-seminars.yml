# Render 무료 플랜은 잠들어 있는 동안 서버 안의 정기 수집(cron)을 놓친다. 수집 도중 잠들면 뒤 순서 사이트(민간교육)가 끝까지 못 돈다.
# 6시간마다 서버를 깨우고 POST /crawl/run 으로 수집을 시킨 뒤, 끝날 때까지 /health 를 불러 서버가 잠들지 않게 붙잡아 둔다.
# 필요한 설정 (저장소 Settings → Secrets and variables → Actions)
#   Variables: BACKEND_URL (예: https://rom-back.onrender.com)
#   Secrets:   CRAWL_TRIGGER_TOKEN (Render 환경변수 CRAWL_TRIGGER_TOKEN 과 같은 값)
name: Crawl seminars

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "최근에 수집한 사이트도 전부 다시 수집"
        type: boolean
        default: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Wake backend and start crawl
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          TOKEN: ${{ secrets.CRAWL_TRIGGER_TOKEN }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$TOKEN" ]; then
            echo "BACKEND_URL 변수나 CRAWL_TRIGGER_TOKEN 비밀값이 없어 건너뜀"
            exit 0
          fi
          BASE="${BACKEND_URL%/}"
          # 잠든 서버가 깨어나는 데 1분 가까이 걸린다
          curl -fsS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 "$BASE/health"
          echo
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 60 \
            -X POST -H "Authorization: Bearer $TOKEN" "$BASE/crawl/run?force=$FORCE"
          echo
          # 수집이 끝날 때까지(최대 약 45분) 3분마다 부른다. 이 요청이 서버를 깨어 있게 한다
          for i in $(seq 1 15); do
            sleep 180
            STATUS=$(curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 60 \
              -H "Authorization: Bearer $TOKEN" "$BASE/crawl/status" || echo '{}')
            if echo "$STATUS" | grep -q '"running":false'; then
              echo "수집 끝"
              echo "$STATUS" | jq -r '.sources[] | "\(.source)\t\(.lastRun.status // "-")\t수집 \(.lastRun.fetched // 0)건\t신규 \(.lastRun.created // 0)\t\(.lastRun.error // "")"'
              exit 0
            fi
            echo "수집 중... (${i})"
          done
          echo "45분 안에 끝나지 않음. Render 로그를 확인하세요"
